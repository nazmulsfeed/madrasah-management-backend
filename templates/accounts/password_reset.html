{% extends "base/base.html" %}
{% block title %}Password Reset{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Password Reset</h1>
<form method="post" class="card card-body">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Send reset link</button>
</form>
{% endblock %}
