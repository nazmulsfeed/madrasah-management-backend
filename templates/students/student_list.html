{% extends "base/base.html" %}
{% block content %}
<h1 class="h4 mb-3">Students</h1>
<form method="get" class="mb-3">
    <input class="form-control" name="q" value="{{ request.GET.q }}" placeholder="Search students">
</form>
<div class="list-group">
    {% for student in students %}
        <div class="list-group-item">{{ student }}</div>
    {% empty %}
        <div class="list-group-item">No students found.</div>
    {% endfor %}
</div>
{% endblock %}
